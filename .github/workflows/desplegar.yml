name: Desplegar en el servidor

# Instala o actualiza KONTIVA ERP en el servidor (VPS) por SSH. Se ejecuta a mano (Actions → Desplegar en el servidor → Run workflow).
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SERVIDOR_HOST       IP o nombre del servidor
#   SERVIDOR_USUARIO    usuario SSH (normalmente root)
#   SERVIDOR_CLAVE_SSH  clave privada SSH   — o bien —   SERVIDOR_PASSWORD  contraseña SSH
# El archivo deploy/.env (contraseñas y secretos) se crea UNA sola vez en el servidor, con valores aleatorios, y nunca sale de ahí.
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a instalar'
        default: 'fase-1-operacion'
      dominio_app:
        description: 'Dominio del ERP'
        default: 'kontiva.araujotechsistemas.com'
      dominio_master:
        description: 'Dominio del Panel Master'
        default: 'kontiva-master.araujotechsistemas.com'
      master_email:
        description: 'Crear el primer usuario del Panel Master con este correo (vacío = no crear)'
        default: ''
      master_nombre:
        description: 'Nombre de ese usuario'
        default: 'Araújo Tech'

concurrency: desplegar

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: El repositorio tiene que ser privado
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::El repositorio es público: el registro de esta ejecución (que puede mostrar la contraseña temporal del Panel Master) quedaría a la vista de cualquiera. Páselo a privado en Settings → General → Danger Zone → Change visibility."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
      - name: Validar datos
        env:
          APP: ${{ inputs.dominio_app }}
          MASTER: ${{ inputs.dominio_master }}
          MAIL: ${{ inputs.master_email }}
          HOST: ${{ secrets.SERVIDOR_HOST }}
          USUARIO: ${{ secrets.SERVIDOR_USUARIO }}
        run: |
          d='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          [[ "$APP" =~ $d && "$MASTER" =~ $d && "$APP" != "$MASTER" ]] || { echo "::error::Dominios inválidos"; exit 1; }
          [[ -z "$MAIL" || "$MAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::Correo inválido"; exit 1; }
          [[ -n "$HOST" && -n "$USUARIO" ]] || { echo "::error::Faltan los secretos SERVIDOR_HOST y SERVIDOR_USUARIO"; exit 1; }
      - name: Preparar SSH
        env:
          CLAVE: ${{ secrets.SERVIDOR_CLAVE_SSH }}
          PASSWORD: ${{ secrets.SERVIDOR_PASSWORD }}
          HOST: ${{ secrets.SERVIDOR_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          [ -s ~/.ssh/known_hosts ] || { echo "::error::No se pudo conectar al servidor por SSH (¿IP correcta, puerto 22 abierto?)"; exit 1; }
          if [ -n "$CLAVE" ]; then printf '%s\n' "$CLAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy; echo "SSH_MODO=clave" >> "$GITHUB_ENV"
          elif [ -n "$PASSWORD" ]; then sudo apt-get install -y -qq sshpass >/dev/null; echo "SSH_MODO=password" >> "$GITHUB_ENV"
          else echo "::error::Falta el secreto SERVIDOR_CLAVE_SSH o SERVIDOR_PASSWORD"; exit 1; fi
      - name: Copiar el código al servidor
        env:
          SSHPASS: ${{ secrets.SERVIDOR_PASSWORD }}
          DESTINO: ${{ secrets.SERVIDOR_USUARIO }}@${{ secrets.SERVIDOR_HOST }}
        run: |
          if [ "$SSH_MODO" = clave ]; then RSH="ssh -i $HOME/.ssh/id_deploy"; else RSH="sshpass -e ssh -o PubkeyAuthentication=no"; fi
          echo "RSH=$RSH" >> "$GITHUB_ENV"
          $RSH "$DESTINO" 'mkdir -p /opt/kontiva/kontiva-erp && command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)'
          # deploy/.env y deploy/backups viven solo en el servidor: nunca se borran ni se pisan
          rsync -az --delete --exclude '.git' --exclude 'node_modules' --exclude 'deploy/.env' --exclude 'deploy/backups' -e "$RSH" ./ "$DESTINO:/opt/kontiva/kontiva-erp/"
      - name: Instalar y arrancar
        env:
          SSHPASS: ${{ secrets.SERVIDOR_PASSWORD }}
          DESTINO: ${{ secrets.SERVIDOR_USUARIO }}@${{ secrets.SERVIDOR_HOST }}
          APP: ${{ inputs.dominio_app }}
          MASTER: ${{ inputs.dominio_master }}
        run: |
          $RSH "$DESTINO" "APP='$APP' MASTER='$MASTER' bash -s" <<'REMOTO'
          set -euo pipefail
          command -v docker >/dev/null || { echo "Instalando Docker…"; curl -fsSL https://get.docker.com | sh >/dev/null; }
          cd /opt/kontiva/kontiva-erp/deploy
          if [ ! -f .env ]; then
            echo "Creando deploy/.env con secretos aleatorios (primera instalación)"
            umask 077
            h() { openssl rand -hex 24; }
            {
              echo "DOMINIO_APP=$APP"; echo "DOMINIO_MASTER=$MASTER"
              echo "PG_SUPER_PASSWORD=$(h)"; echo "PG_OWNER_PASSWORD=$(h)"; echo "PG_APP_PASSWORD=$(h)"; echo "PG_MASTER_PASSWORD=$(h)"
              echo "JWT_SECRET=$(openssl rand -hex 48)"; echo "JWT_MASTER_SECRET=$(openssl rand -hex 48)"
              echo "CIFRADO_CLAVE=$(openssl rand -base64 32)"
              echo "SMTP_URL="; echo 'MAIL_FROM="KONTIVA ERP <no-responder@araujotechsistemas.com>"'
            } > .env
          else
            # los dominios se pueden cambiar; contraseñas y secretos no se tocan
            sed -i "s|^DOMINIO_APP=.*|DOMINIO_APP=$APP|; s|^DOMINIO_MASTER=.*|DOMINIO_MASTER=$MASTER|" .env
          fi
          docker compose up -d --build 2>&1 | tail -n 25
          echo "--- migraciones"; docker compose logs --no-log-prefix migrar | tail -n 8
          echo "--- servicios"; docker compose ps --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'
          docker compose ps --status running --format '{{.Service}}' | grep -qx api || { echo "La API no quedó en marcha"; docker compose logs --tail 40 api; exit 1; }
          REMOTO
      - name: Crear el primer usuario del Panel Master
        if: ${{ inputs.master_email != '' }}
        env:
          SSHPASS: ${{ secrets.SERVIDOR_PASSWORD }}
          DESTINO: ${{ secrets.SERVIDOR_USUARIO }}@${{ secrets.SERVIDOR_HOST }}
          MAIL: ${{ inputs.master_email }}
          NOMBRE: ${{ inputs.master_nombre }}
        run: |
          N=$(printf '%s' "$NOMBRE" | tr -cd '[:alnum:] ._áéíóúÁÉÍÓÚñÑ-' | cut -c1-60)
          $RSH "$DESTINO" "cd /opt/kontiva/kontiva-erp/deploy && docker compose exec -T master node dist/cli.js master:crear --email '$MAIL' --nombre '$N'"
          echo "Anote la contraseña temporal de arriba, entre en https://${{ inputs.dominio_master }} y cámbiela. Después borre el registro de esta ejecución (⋯ → Delete all logs)."
      - name: Comprobar que responde por HTTPS
        env:
          APP: ${{ inputs.dominio_app }}
          MASTER: ${{ inputs.dominio_master }}
        run: |
          for u in "https://$APP" "https://$MASTER"; do
            c=000; for i in 1 2 3 4 5 6; do c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$u" 2>/dev/null || echo 000); [ "$c" != 000 ] && break; sleep 15; done
            if [ "$c" = 000 ]; then echo "::warning::$u todavía no responde por HTTPS: revise que el DNS apunte al servidor y que los puertos 80 y 443 estén abiertos"; else echo "OK $u -> HTTP $c"; fi
          done
