name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Paquete compartido
        run: pnpm --filter @kontiva/shared build
      - name: Tipos
        run: pnpm -r typecheck
      - name: Pruebas (unidad, API, aislamiento, permisos)
        run: pnpm -r test
      - name: Build
        run: pnpm build
      - name: Dependencias con vulnerabilidades altas
        run: pnpm audit --prod --audit-level high
