name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Paquete compartido
        run: pnpm --filter @kontiva/shared build
      - name: Tipos
        run: pnpm -r typecheck
      - name: Pruebas (unidad, API, aislamiento, permisos)
        run: pnpm -r test
      - name: Build
        run: pnpm build
      - name: Documentación de la API al día
        run: node scripts/documentar-api.mjs && git diff --exit-code docs/api
      - name: Dependencias con vulnerabilidades altas
        run: pnpm audit --prod --audit-level high

  imagen:
    # Verifica que la imagen de producción se construye (no se publica).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t kontiva-erp:ci .
      - name: La imagen arranca y responde
        run: |
          docker network create k
          docker run -d --name pg --network k -e POSTGRES_PASSWORD=postgres \
            -e KONTIVA_OWNER_PASSWORD=o -e KONTIVA_APP_PASSWORD=a -e KONTIVA_MASTER_PASSWORD=m \
            -v "$PWD/deploy/postgres-init.sh:/docker-entrypoint-initdb.d/01-kontiva.sh:ro" postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -d kontiva && break; sleep 2; done
          COMUN="-e JWT_SECRET=ci-0123456789abcdef0123456789abcdef -e JWT_MASTER_SECRET=ci-master-0123456789abcdef0123456789 -e CIFRADO_CLAVE=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= -e DATABASE_URL=postgresql://kontiva_app:a@pg:5432/kontiva"
          docker run --rm --network k $COMUN -e DATABASE_OWNER_URL=postgresql://kontiva_owner:o@pg:5432/kontiva kontiva-erp:ci node dist/cli.js migrar
          docker run -d --name api --network k -p 3000:3000 $COMUN kontiva-erp:ci
          docker run -d --name master --network k -p 3001:3001 $COMUN -e DATABASE_MASTER_URL=postgresql://kontiva_master:m@pg:5432/kontiva kontiva-erp:ci node dist/main-master.js
          sleep 5
          curl -fsS localhost:3000/api/salud
          curl -fsS localhost:3001/api/master/salud
          curl -fsS localhost:3000/ | grep -q "KONTIVA ERP"
          curl -fsS localhost:3001/ | grep -q "KONTIVA Master"

  # Instalación real (API + web) con datos de prueba: pantallas en Chrome y prueba de carga con verificación de integridad.
  pantallas-y-carga:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roles y base
        run: PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db-roles.sql
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm db:migrate
      - name: Empresa y cajeros de prueba
        working-directory: apps/api
        run: |
          node dist/cli.js empresa:crear --razon "Pruebas CI S.A." --plan ENTERPRISE --email dueno@ci.test --nombre "Dueño CI" --contrasena "Dueno-CI-2026!" | tee /tmp/empresa.txt
          EMPRESA=$(grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' /tmp/empresa.txt | head -1)
          for i in 1 2 3 4; do
            node dist/cli.js usuario:crear --empresa "$EMPRESA" --email "cajero$i@ci.test" --nombre "Cajero $i" --perfil cajero --contrasena "Cajero-CI-2026!"
          done
      - name: API y web en marcha
        run: |
          (cd apps/api && LIMITE_POR_MINUTO=100000 nohup node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup pnpm exec vite preview --port 5173 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/salud > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -fsS localhost:5173/ > /dev/null && break; sleep 1; done
      - name: Pantallas (Chrome)
        env:
          E2E_WEB: http://localhost:5173
          E2E_EMAIL: dueno@ci.test
          E2E_CONTRASENA: Dueno-CI-2026!
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm --filter @kontiva/e2e pantallas
      - name: Carga (60 s, 4 cajas vendiendo y 20 usuarios consultando)
        env:
          E2E_API: http://localhost:3000/api
          E2E_EMAIL: dueno@ci.test
          E2E_CONTRASENA: Dueno-CI-2026!
          E2E_CAJEROS: cajero1@ci.test,cajero2@ci.test,cajero3@ci.test,cajero4@ci.test
          E2E_CONTRASENA_CAJEROS: Cajero-CI-2026!
          CARGA_SEGUNDOS: "60"
          CARGA_USUARIOS: "20"
        run: pnpm --filter @kontiva/e2e carga
      - name: Registro de la API (si falla)
        if: failure()
        run: tail -n 200 /tmp/api.log

  # Agente local del PDV como ejecutable de Windows (kontiva-agente.exe), descargable desde la ejecución.
  agente-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @kontiva/agente...
      - name: Pruebas del agente
        run: pnpm --filter @kontiva/agente test
      - name: Ejecutable
        run: pnpm --filter @kontiva/agente empaquetar
      - name: Probar el ejecutable
        shell: pwsh
        run: |
          '{"puerto":9425,"token":"prueba-ci-123456","origenes":[],"impresora":{"tipo":"prueba"},"ancho":48}' | Set-Content $env:RUNNER_TEMP\agente.json
          $env:KONTIVA_AGENTE_CONFIG = "$env:RUNNER_TEMP\agente.json"
          $p = Start-Process -FilePath apps\agente\ejecutable\kontiva-agente.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9425/prueba -Headers @{ 'X-Agente-Token' = 'prueba-ci-123456' }
          Stop-Process -Id $p.Id
          if (-not $r.ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: kontiva-agente-windows
          path: |
            apps/agente/ejecutable/kontiva-agente.exe
            apps/agente/instalar/instalar-windows.ps1
            apps/agente/README.md
          retention-days: 90
