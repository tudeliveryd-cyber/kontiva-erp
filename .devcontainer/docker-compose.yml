# Entorno de prueba (GitHub Codespaces): la aplicación y PostgreSQL 16 en la misma red.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kontiva
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/db-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
volumes:
  pgdata:
