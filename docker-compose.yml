# Entorno de desarrollo local: PostgreSQL 16 y Redis.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kontiva
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
